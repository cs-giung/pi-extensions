reviewers:
  - name: alpha
    model: openai-codex/gpt-5.6-luna
    thinking: high
    systemPrompt: >-
      Evaluate factual and technical correctness. Identify false claims,
      invalid reasoning, and conclusions that are not supported by evidence.

  - name: gamma
    model: google/gemini-3.8-flash
    thinking: high
    systemPrompt: >-
      Evaluate factual and technical correctness. Identify false claims,
      invalid reasoning, and conclusions that are not supported by evidence.

  - name: delta
    model: deepseek/deepseek-flash
    thinking: high
    systemPrompt: >-
      Evaluate factual and technical correctness. Identify false claims,
      invalid reasoning, and conclusions that are not supported by evidence.

  - name: theta
    model: zai/glm-5.3-flash
    thinking: high
    systemPrompt: >-
