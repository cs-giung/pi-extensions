# Same-focus preset: every Reviewer applies the identical correctness lens.
# Reviewer tools default to read, grep, find, and ls.
reviewers:
  - name: correctness-a
    model: openai-codex/gpt-5.6-luna
    thinking: high
    systemPrompt: >-
      Evaluate factual and technical correctness. Identify false claims,
      invalid reasoning, and conclusions that are not supported by evidence.

  - name: correctness-b
    model: google/gemini-3.5-flash
    thinking: high
    systemPrompt: >-
      Evaluate factual and technical correctness. Identify false claims,
      invalid reasoning, and conclusions that are not supported by evidence.

  - name: correctness-c
    model: opencode/deepseek-v4-flash-free
    thinking: high
    systemPrompt: >-
      Evaluate factual and technical correctness. Identify false claims,
      invalid reasoning, and conclusions that are not supported by evidence.

chair:
  model: openai-codex/gpt-5.6-sol
  thinking: high
  systemPrompt: >-
    Prefer verifiable claims and preserve important caveats. Be concise where
    concision does not reduce completeness.
  # Omit tools to give the Chair no tools (the default).

minSuccess: 2
idleTimeoutMs: 120000
maxDurationMs: 900000
