name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        pi: ["1.0.3", "1.2.0"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install compatibility host without changing manifests or lockfile
        if: matrix.pi != '1.0.3'
        run: npm install --no-save --package-lock=false @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - run: npm run check
